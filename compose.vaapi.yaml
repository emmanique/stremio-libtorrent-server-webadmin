# VAAPI-only overlay. Pass only the render node required for hardware
# transcoding. This is LXC-safe and avoids invalid /dev/dri/card* entries
# exposed by some unprivileged Proxmox containers.
#
# Prefer start.sh, which discovers and exports the working render node.
# Direct Compose use must set VAAPI_DEVICE explicitly.
#
#   VAAPI_DEVICE=/dev/dri/renderD129 docker compose -f compose.yaml -f compose.vaapi.yaml up -d
services:
  stremio-libtorrent-server:
    devices:
      - "${VAAPI_DEVICE:?VAAPI_DEVICE must point to a detected /dev/dri/renderD* device}:${VAAPI_DEVICE:?VAAPI_DEVICE must point to a detected /dev/dri/renderD* device}"
    # Forward the VAAPI driver selected by start.sh.
    # start.sh derives the driver from the detected DRM hardware when no
    # explicit LIBVA_DRIVER_NAME override is configured.
    # Direct Compose users may provide LIBVA_DRIVER_NAME explicitly.
    environment:
      - LIBVA_DRIVER_NAME
