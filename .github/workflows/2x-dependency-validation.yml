name: 2.x Dependency Validation

on:
  pull_request:
    branches:
      - develop/2.x
      - main
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "webadmin/requirements.txt"
      - "Dockerfile"
      - "webadmin/Dockerfile"
      - "vpn/Dockerfile"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python lock and dependency graph
        run: |
          python -m pip install --upgrade pip uv pip-audit
          uv lock --check
          uv sync --dev
          python -m pip install -r webadmin/requirements.txt
          uv run python -m pip check
          python -m pip check

      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          pip-audit -r webadmin/requirements.txt
          uv export --no-dev --format requirements-txt -o /tmp/core-requirements.txt
          pip-audit -r /tmp/core-requirements.txt

      - name: Regression tests affected by runtime dependencies
        run: |
          timeout 300s uv run --with-requirements webadmin/requirements.txt pytest -q             tests/test_app.py             tests/test_config.py             tests/test_health.py             tests/test_webadmin_config_lifecycle.py             tests/test_single_compose_vpn.py

      - name: Build dependency-sensitive images
        run: |
          docker build -t dependency-check-server .
          docker build -t dependency-check-webadmin ./webadmin
          docker build -t dependency-check-vpn ./vpn
