name: VPN integration guard

on:
  push:
    branches:
      - future
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  vpn-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate VPN Compose and scripts
        shell: bash
        run: |
          set -euo pipefail
          export IPADDRESS=192.0.2.10
          export PIHOLE_WEB_BIND_IP=192.0.2.10
          export VPN_CONTROL_API_KEY=test-control-key
          sh -n start-vpn.sh
          sh -n vpn/entrypoint.sh
          docker compose -f compose.vpn.yaml config --quiet
          grep -q 'network_mode: "service:gluetun"' compose.vpn.yaml
          grep -q 'VPN_SERVICE_PROVIDER: cyberghost' compose.vpn.yaml
          grep -q 'HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE' compose.vpn.yaml
          if grep -Eq '^\s+- .*6881:.*6881' compose.vpn.yaml; then
            echo 'VPN mode must not publish BitTorrent port 6881 on the host.' >&2
            exit 1
          fi

      - name: Build WebAdmin with VPN module
        run: docker build -t webadmin-vpn-validation:local ./webadmin

      - name: Smoke-test WebAdmin VPN UI and API
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f webadmin-vpn-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cleanup
          docker run -d \
            --name webadmin-vpn-smoke \
            -p 18090:8090 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            webadmin-vpn-validation:local >/dev/null

          ready=''
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18090/health >/dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 1
          done
          test -n "$ready" || {
            docker logs --tail=100 webadmin-vpn-smoke >&2 || true
            exit 1
          }

          curl -fsS http://127.0.0.1:18090/ | grep -q '/vpn-admin.js'
          curl -fsS http://127.0.0.1:18090/vpn-admin.js | grep -q 'Disconnect (block traffic)'
          curl -fsS http://127.0.0.1:18090/api/vpn/status > /tmp/vpn-status.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/vpn-status.json', encoding='utf-8'))
          assert data['deploymentMode'] == 'direct', data
          assert data['routing']['stremioThroughVpn'] is False, data
          credentials = data['config']['credentials']
          assert set(credentials) == {'username', 'password', 'clientCert', 'clientKey'}, credentials
          assert all(value is False for value in credentials.values()), credentials
          serialized = json.dumps(data)
          assert 'openvpn_password' not in serialized
          assert 'PRIVATE KEY' not in serialized
          PY

      - name: Validate VPN JavaScript syntax
        run: node --check webadmin/static/vpn-admin.js

      - name: Build VPN gateway package
        run: |
          docker build -t vpn-validation:local ./vpn
          docker run --rm --entrypoint /bin/sh vpn-validation:local \
            -c 'test -x /stremio-vpn-entrypoint && test -x /gluetun-entrypoint'
