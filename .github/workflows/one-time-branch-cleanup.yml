name: One-time branch cleanup

on:
  push:
    branches:
      - future
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete remote branches
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mapfile -t branches < <(git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort)
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|future)
                echo "keeping $branch"
                ;;
              *)
                echo "deleting $branch"
                git push origin --delete "$branch"
                ;;
            esac
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
