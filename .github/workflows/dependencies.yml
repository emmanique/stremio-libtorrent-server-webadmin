name: Dependencies

on:
  push:
    branches: [main, development, "release/**"]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "webadmin/requirements.txt"
      - "Dockerfile"
      - "webadmin/Dockerfile"
      - "vpn/Dockerfile"
      - ".github/dependabot.yml"
      - ".github/workflows/dependencies.yml"
  pull_request:
    branches: [main, development]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "webadmin/requirements.txt"
      - "Dockerfile"
      - "webadmin/Dockerfile"
      - "vpn/Dockerfile"
      - ".github/dependabot.yml"
      - ".github/workflows/dependencies.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Bootstrap repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --force --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' --depth=100

      - name: Validate dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip uv pip-audit
          uv lock --check
          uv sync --dev
          python3 -m pip install -r webadmin/requirements.txt
          uv pip check
          python3 -m pip check
          pip-audit -r webadmin/requirements.txt || true
          uv export --no-dev --format requirements-txt -o /tmp/core-requirements.txt
          pip-audit -r /tmp/core-requirements.txt || true

      - name: Dependency-sensitive tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. timeout 300s uv run --with-requirements webadmin/requirements.txt pytest -q \
            tests/test_app.py \
            tests/test_config.py \
            tests/test_health.py \
            tests/test_webadmin_config_lifecycle.py \
            tests/test_single_compose_vpn.py

      - name: Dependency-sensitive image builds
        shell: bash
        run: |
          set -euo pipefail
          docker build -t dependency-server:test .
          docker build -t dependency-webadmin:test ./webadmin
          docker build -t dependency-vpn:test ./vpn
