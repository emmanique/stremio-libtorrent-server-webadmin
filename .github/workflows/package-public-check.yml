name: Public package pull check

on:
  workflow_run:
    workflows:
      - "Release package"
      - "2.x Release"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-pull:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out stable version identifiers
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve package versions
        shell: bash
        run: |
          set -euo pipefail
          SERVER_VERSION="$(tr -d '[:space:]' < SERVER_VERSION)"
          WEBADMIN_VERSION="$(tr -d '[:space:]' < webadmin/WEBADMIN_VERSION)"
          echo "SERVER_VERSION=$SERVER_VERSION" >> "$GITHUB_ENV"
          echo "WEBADMIN_VERSION=$WEBADMIN_VERSION" >> "$GITHUB_ENV"

      - name: Remove registry authentication
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -f "$HOME/.docker/config.json" || true

      - name: Pull Server package anonymously
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/emmanique/stremio-libtorrent-server-webadmin:${SERVER_VERSION}"
          docker image rm "$IMAGE" >/dev/null 2>&1 || true
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" >/dev/null

      - name: Pull WebAdmin package anonymously
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/emmanique/stremio-libtorrent-server-webadmin-webadmin:${WEBADMIN_VERSION}"
          docker image rm "$IMAGE" >/dev/null 2>&1 || true
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" >/dev/null

      - name: Pull VPN gateway package anonymously
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/emmanique/stremio-libtorrent-server-webadmin-vpn:${SERVER_VERSION}"
          docker image rm "$IMAGE" >/dev/null 2>&1 || true
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" >/dev/null
