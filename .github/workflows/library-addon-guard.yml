name: Library addon guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-library-addon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m compileall -q src/stremiosrv/library webadmin/addon_links.py

      - name: Exercise Library poster fallback and release recognition
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import stremiosrv.library as lib
          from stremiosrv.library import addon_model as am
          from stremiosrv.library import metadata

          entry = {
              "infoHash": "0123456789abcdef0123456789abcdef01234567",
              "name": "release.folder.name",
              "size": 1073741824,
              "state": "idle",
              "progress": 1.0,
              "pinned": False,
              "seeds": 0,
              "label": {"metaId": "tt1234567", "type": "movie"},
              "files": [],
          }
          preview = am.preview(entry)
          detail = am.meta_for(entry)
          expected = "https://images.metahub.space/poster/medium/tt1234567/img"
          assert preview["poster"] == expected, preview
          assert detail["poster"] == expected, detail
          assert preview["posterShape"] == "poster", preview

          hint = metadata.release_hint(
              "The.Gentlemen.S02E04.The.Bigger.Picture.1080p.HEVC.x265.mkv"
          )
          assert hint == {"title": "The Gentlemen", "type": "series", "season": 2, "episode": 4}, hint
          hint = metadata.release_hint("The.Gentlemen.2024.S02E02.1080p.WEB-DL.mkv")
          assert hint["title"] == "The Gentlemen" and hint["year"] == 2024, hint
          hint = metadata.release_hint("The Gentlemen S02 (2026) 1080p WEBRip x265")
          assert hint["title"] == "The Gentlemen" and "year" not in hint, hint
          hint = metadata.release_hint("1923.S02E01.1080p.WEB-DL.mkv")
          assert hint["title"] == "1923" and "year" not in hint, hint

          old = lib._metadata.resolve
          try:
              lib._metadata.resolve = lambda name: {
                  "metaId": "tt7654321", "type": "series", "name": "Recognised Show",
                  "poster": "https://example.invalid/poster.jpg", "season": 2, "episode": 4,
              }
              unlabeled = dict(entry, name="Recognised.Show.S02E04.1080p.mkv", label=None)
              rendered = am.preview(unlabeled)
              assert rendered["name"] == "Recognised Show · S02E04", rendered
              assert rendered["poster"] == "https://example.invalid/poster.jpg", rendered
              assert unlabeled["label"] is None
          finally:
              lib._metadata.resolve = old
          PY

      - name: Validate WebAdmin addon JavaScript
        run: node --check webadmin/static/addon-connect.js

      - name: Validate release identifiers
        shell: bash
        run: |
          set -euo pipefail
          cmp -s SERVER_VERSION FORK_VERSION
          test -s webadmin/WEBADMIN_VERSION
          grep -q 'images.metahub.space/poster/medium' src/stremiosrv/library/__init__.py
          grep -q 'v3-cinemeta.strem.io' src/stremiosrv/library/metadata.py
          grep -q '/api/addons/library/update' webadmin/addon_links.py
          grep -q 'Manage / Delete titles' webadmin/static/addon-connect.js
