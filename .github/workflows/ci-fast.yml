name: Fast CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip uv
          uv sync --dev
          python -m pip install -r webadmin/requirements.txt

      - name: Static and repository validation
        run: bash tools/ci/static-check.sh

      - name: Compose validation
        run: bash tools/ci/compose-check.sh

      - name: Documentation/change contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/ci/docs-contract.py

      - name: Deterministic regression tests
        run: bash tools/ci/run-tests.sh deterministic
