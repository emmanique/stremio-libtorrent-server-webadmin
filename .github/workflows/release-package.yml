name: Release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable tag to build and publish, e.g. v1.6.9-server.10"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: edmanique/stremio-libtorrent-server-webadmin
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release tag and component versions
        shell: bash
        run: |
          set -euo pipefail
          SERVER_VERSION="$(tr -d '[:space:]' < SERVER_VERSION)"
          FORK_VERSION="$(tr -d '[:space:]' < FORK_VERSION)"
          WEBADMIN_VERSION="$(tr -d '[:space:]' < webadmin/WEBADMIN_VERSION)"
          CORE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          EXPECTED_TAG="v${SERVER_VERSION}"

          test "$SERVER_VERSION" = "$FORK_VERSION"
          test "$RELEASE_TAG" = "$EXPECTED_TAG" || {
            echo "Tag $RELEASE_TAG does not match SERVER_VERSION $SERVER_VERSION" >&2
            exit 1
          }

          echo "SERVER_VERSION=$SERVER_VERSION" >> "$GITHUB_ENV"
          echo "WEBADMIN_VERSION=$WEBADMIN_VERSION" >> "$GITHUB_ENV"
          echo "CORE_VERSION=$CORE_VERSION" >> "$GITHUB_ENV"
          echo "SERVER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin" >> "$GITHUB_ENV"
          echo "WEBADMIN_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin-webadmin" >> "$GITHUB_ENV"
          echo "VPN_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin-vpn" >> "$GITHUB_ENV"
          echo "Release: tag=$RELEASE_TAG server=$SERVER_VERSION core=$CORE_VERSION webadmin=$WEBADMIN_VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker Hub publishing disabled
        if: ${{ env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' }}
        shell: bash
        run: |
          echo "Docker Hub publishing is skipped because DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN are not configured."

      - name: Build server runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${SERVER_VERSION}" \
            --label "org.opencontainers.image.title=Stremio Server WebAdmin Runtime" \
            -t "${SERVER_IMAGE}:${SERVER_VERSION}" \
            -t "${SERVER_IMAGE}:latest" \
            .

      - name: Build WebAdmin image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${WEBADMIN_VERSION}" \
            --label "org.opencontainers.image.title=Stremio Server WebAdmin UI" \
            -t "${WEBADMIN_IMAGE}:${WEBADMIN_VERSION}" \
            -t "${WEBADMIN_IMAGE}:latest" \
            ./webadmin

      - name: Build CyberGhost VPN gateway image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${SERVER_VERSION}" \
            --label "org.opencontainers.image.title=Stremio CyberGhost Gluetun Gateway" \
            -t "${VPN_IMAGE}:${SERVER_VERSION}" \
            -t "${VPN_IMAGE}:latest" \
            ./vpn

      - name: Smoke-test server runtime image
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f stremio-release-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cleanup
          docker run -d --name stremio-release-smoke -p 18099:11470 "${SERVER_IMAGE}:${SERVER_VERSION}" >/dev/null
          healthy=""
          for i in $(seq 1 180); do
            if body="$(curl -fsS http://127.0.0.1:18099/health 2>/dev/null)"; then
              healthy="$body"
              break
            fi
            sleep 1
          done
          if [ -z "$healthy" ]; then
            echo "Server smoke test failed: /health did not become ready." >&2
            docker logs --tail 100 stremio-release-smoke >&2 || true
            exit 1
          fi
          echo "$healthy"
          printf '%s' "$healthy" | grep -q "\"version\":\"${CORE_VERSION}\"" || {
            echo "Health response does not report core version ${CORE_VERSION}." >&2
            exit 1
          }

      - name: Smoke-test WebAdmin image
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f webadmin-release-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cleanup
          docker run -d \
            --name webadmin-release-smoke \
            -p 18090:8090 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "${WEBADMIN_IMAGE}:${WEBADMIN_VERSION}" >/dev/null
          healthy=""
          for i in $(seq 1 90); do
            if body="$(curl -fsS http://127.0.0.1:18090/health 2>/dev/null)"; then
              healthy="$body"
              break
            fi
            sleep 1
          done
          if [ -z "$healthy" ]; then
            echo "WebAdmin smoke test failed: /health did not become ready." >&2
            docker logs --tail 100 webadmin-release-smoke >&2 || true
            exit 1
          fi
          echo "$healthy"
          curl -fsS http://127.0.0.1:18090/ | grep -q 'vpn-admin.js'

      - name: Smoke-test VPN gateway image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "${VPN_IMAGE}:${SERVER_VERSION}" \
            -c 'test -x /stremio-vpn-entrypoint && test -x /gluetun-entrypoint'

      - name: Publish GitHub Packages
        shell: bash
        run: |
          set -euo pipefail
          docker push "${SERVER_IMAGE}:${SERVER_VERSION}"
          docker push "${SERVER_IMAGE}:latest"
          docker push "${WEBADMIN_IMAGE}:${WEBADMIN_VERSION}"
          docker push "${WEBADMIN_IMAGE}:latest"
          docker push "${VPN_IMAGE}:${SERVER_VERSION}"
          docker push "${VPN_IMAGE}:latest"

      - name: Tag images for Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${SERVER_IMAGE}:${SERVER_VERSION}" "${DOCKERHUB_IMAGE}:${SERVER_VERSION}"
          docker tag "${SERVER_IMAGE}:${SERVER_VERSION}" "${DOCKERHUB_IMAGE}:latest"
          docker tag "${WEBADMIN_IMAGE}:${WEBADMIN_VERSION}" "${DOCKERHUB_IMAGE}:webadmin-${WEBADMIN_VERSION}"
          docker tag "${WEBADMIN_IMAGE}:${WEBADMIN_VERSION}" "${DOCKERHUB_IMAGE}:webadmin-latest"
          docker tag "${VPN_IMAGE}:${SERVER_VERSION}" "${DOCKERHUB_IMAGE}:vpn-${SERVER_VERSION}"
          docker tag "${VPN_IMAGE}:${SERVER_VERSION}" "${DOCKERHUB_IMAGE}:vpn-latest"

      - name: Publish Docker Hub packages
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "${DOCKERHUB_IMAGE}:${SERVER_VERSION}"
          docker push "${DOCKERHUB_IMAGE}:latest"
          docker push "${DOCKERHUB_IMAGE}:webadmin-${WEBADMIN_VERSION}"
          docker push "${DOCKERHUB_IMAGE}:webadmin-latest"
          docker push "${DOCKERHUB_IMAGE}:vpn-${SERVER_VERSION}"
          docker push "${DOCKERHUB_IMAGE}:vpn-latest"

      - name: Sync Docker Hub overview from README
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        shell: bash
        env:
          DOCKERHUB_USER: ${{ env.DOCKERHUB_USERNAME }}
          REPO: edmanique/stremio-libtorrent-server-webadmin
        run: |
          set -euo pipefail
          sh docker/push-readme.sh

      - name: Create or refresh GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="docs/releases/${RELEASE_TAG}.md"
          NOTES_FILE="$NOTES"

          if [ ! -f "$NOTES_FILE" ]; then
            git fetch origin main --depth=1
            if git cat-file -e "origin/main:${NOTES}" 2>/dev/null; then
              NOTES_FILE="/tmp/release-notes.md"
              git show "origin/main:${NOTES}" > "$NOTES_FILE"
            else
              NOTES_FILE="/tmp/release-notes.md"
              printf '%s\n' \
                "# Stremio Server WebAdmin ${SERVER_VERSION}" \
                "" \
                "## Components" \
                "" \
                "- Core: ${CORE_VERSION}" \
                "- Server/Fork: ${SERVER_VERSION}" \
                "- WebAdmin: ${WEBADMIN_VERSION}" \
                "- VPN gateway: ${SERVER_VERSION}" \
                "" \
                "## GitHub Container Registry" \
                "" \
                "- ${SERVER_IMAGE}:${SERVER_VERSION}" \
                "- ${WEBADMIN_IMAGE}:${WEBADMIN_VERSION}" \
                "- ${VPN_IMAGE}:${SERVER_VERSION}" \
                "" \
                "## Docker Hub" \
                "" \
                "- ${DOCKERHUB_IMAGE}:${SERVER_VERSION}" \
                "- ${DOCKERHUB_IMAGE}:webadmin-${WEBADMIN_VERSION}" \
                "- ${DOCKERHUB_IMAGE}:vpn-${SERVER_VERSION}" \
                "" \
                "This release was built, smoke-tested and published automatically from the validated release tag." \
                > "$NOTES_FILE"
            fi
          fi

          TITLE="Stremio Server WebAdmin ${SERVER_VERSION}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes-file "$NOTES_FILE" --latest
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$TITLE" --notes-file "$NOTES_FILE" --latest
          fi
