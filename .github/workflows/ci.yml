name: CI

on:
  push:
    branches:
      - main
      - develop/2.x
      - "release/**"
      - "maintenance/**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - main
      - develop/2.x
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip uv
          uv sync --dev
          python -m pip install -r webadmin/requirements.txt

      - name: Repository contract
        shell: bash
        run: bash tools/ci/repo-guard.sh

      - name: Version bump contract on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"

          if printf '%s\n' "$changed" | grep -Eq '^(Dockerfile|compose\.yaml|compose\.(gpu|vaapi|dns|hub)\.yaml|vpn/|docker/ffmpeg_wrapper\.py|docker/webadmin_entrypoint\.py)$'; then
            git diff --quiet "$BASE_SHA"...HEAD -- SERVER_VERSION FORK_VERSION && {
              echo "Runtime/distribution changed without SERVER_VERSION/FORK_VERSION bump." >&2
              exit 1
            }
          fi

          if printf '%s\n' "$changed" | grep -Eq '^webadmin/'; then
            git diff --quiet "$BASE_SHA"...HEAD -- webadmin/WEBADMIN_VERSION && {
              echo "WebAdmin changed without WEBADMIN_VERSION bump." >&2
              exit 1
            }
          fi

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src webadmin docker tools
          sh -n start.sh
          sh -n start-vpn.sh
          sh -n vpn/entrypoint.sh
          sh -n docker/launch.sh
          sh -n docker/publish.sh
          sh -n docker/push-readme.sh
          bash -n tools/ci/repo-guard.sh
          node --check webadmin/static/component-versions.js
          node --check webadmin/static/transcoding-dashboard.js
          node --check webadmin/static/transcoding-runtime-fix.js
          node --check webadmin/static/transcoding-simple-config.js
          node --check webadmin/static/vpn-admin.js
          node --check webadmin/static/addon-connect.js

      - name: Windows launcher validation
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            foreach ($file in @("start.ps1", "start-vpn.ps1")) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $file),
                [ref]$tokens,
                [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
                exit 1
              }
            }
          '
          python - <<'PY'
          from pathlib import Path
          for name in ("start.bat", "start-vpn.bat"):
              text = Path(name).read_text(encoding="utf-8", errors="replace").lower()
              assert "powershell.exe" in text, f"{name} does not invoke PowerShell"
              assert "%*" in text, f"{name} does not forward arguments"
              assert "exit /b %errorlevel%" in text, f"{name} does not preserve exit code"

          docs = Path("docs/WINDOWS.md").read_text(encoding="utf-8", errors="replace")
          root = Path("WINDOWS.md").read_text(encoding="utf-8", errors="replace")
          for name in ("start.bat", "start-vpn.bat", "start.ps1", "start-vpn.ps1"):
              assert name in docs, f"docs/WINDOWS.md missing {name}"
              assert name in root, f"WINDOWS.md missing {name}"
          PY

      - name: Compose validation
        shell: bash
        run: |
          set -euo pipefail
          export IPADDRESS=192.0.2.10
          export PIHOLE_WEB_BIND_IP=192.0.2.10
          export PIHOLE_DNS_BIND_IP=192.0.2.10
          test ! -e compose.vpn.yaml
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dns.yaml config --quiet
          docker compose -f compose.yaml -f compose.vaapi.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
          STREMIO_IMAGE=ghcr.io/emmanique/stremio-libtorrent-server-webadmin:latest             docker compose -f compose.hub.yaml config --quiet

      - name: Deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. timeout 600s uv run --with-requirements webadmin/requirements.txt             pytest -q -m "not integration" tests

      - name: Network integration tests
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            echo "Integration attempt $attempt/3"
            if PYTHONPATH=. timeout 300s uv run --with-requirements webadmin/requirements.txt               pytest -q -m integration tests; then
              ok=1
              break
            fi
            [ "$attempt" -eq 3 ] || sleep $((attempt * 10))
          done
          test "$ok" -eq 1

      - name: Build runtime images
        shell: bash
        run: |
          set -euo pipefail
          build_retry() {
            tag="$1"
            context="$2"
            for attempt in 1 2 3; do
              docker build -t "$tag" "$context" && return 0
              [ "$attempt" -eq 3 ] && return 1
              sleep $((attempt * 5))
            done
          }
          build_retry stremio-ci-server:test .
          build_retry stremio-ci-webadmin:test ./webadmin
          build_retry stremio-ci-vpn:test ./vpn

      - name: Server image health smoke
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f stremio-ci-server >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cleanup
          docker run -d --name stremio-ci-server -p 18099:11470 stremio-ci-server:test >/dev/null
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18099/health >/tmp/server-health.json 2>/dev/null; then
              cat /tmp/server-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs --tail=100 stremio-ci-server >&2 || true
          exit 1

      - name: WebAdmin and VPN image smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python stremio-ci-webadmin:test -c 'import app'
          docker run --rm --entrypoint /bin/sh stremio-ci-vpn:test             -c 'test -x /stremio-vpn-entrypoint && test -x /gluetun-entrypoint'

      - name: VPN profile lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f webadmin-vpn-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cleanup
          docker run -d             --name webadmin-vpn-smoke             -p 18090:8090             -v /var/run/docker.sock:/var/run/docker.sock             stremio-ci-webadmin:test >/dev/null

          ready=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18090/health >/dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 1
          done
          test -n "$ready" || {
            docker logs --tail=100 webadmin-vpn-smoke >&2 || true
            exit 1
          }

          python tools/ci/vpn-profile-smoke.py

