name: Release validated main

on:
  workflow_run:
    workflows:
      - "Fork integration guard"
    types:
      - completed

permissions:
  contents: write
  actions: write

jobs:
  dispatch-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for matching validation guards
        shell: bash
        run: |
          set -euo pipefail

          wait_for_guard() {
            workflow="$1"
            for i in $(seq 1 72); do
              row="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --commit "$TARGET_SHA" \
                --limit 1 \
                --json status,conclusion,headSha \
                --jq '.[0] // empty')"

              if [ -n "$row" ]; then
                status="$(printf '%s' "$row" | jq -r '.status')"
                conclusion="$(printf '%s' "$row" | jq -r '.conclusion // ""')"
                if [ "$status" = "completed" ]; then
                  test "$conclusion" = "success" || {
                    echo "$workflow concluded: $conclusion" >&2
                    exit 1
                  }
                  echo "$workflow passed for $TARGET_SHA"
                  return 0
                fi
              fi
              sleep 5
            done
            echo "Timed out waiting for $workflow for $TARGET_SHA" >&2
            exit 1
          }

          wait_for_guard "Library addon guard"
          wait_for_guard "VPN integration guard"

      - name: Check out validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Create version tag when missing
        id: release
        shell: bash
        run: |
          set -euo pipefail
          SERVER_VERSION="$(tr -d '[:space:]' < SERVER_VERSION)"
          FORK_VERSION="$(tr -d '[:space:]' < FORK_VERSION)"
          WEBADMIN_VERSION="$(tr -d '[:space:]' < webadmin/WEBADMIN_VERSION)"
          CORE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          test "$SERVER_VERSION" = "$FORK_VERSION"
          TAG="v${SERVER_VERSION}"

          echo "server_version=$SERVER_VERSION" >> "$GITHUB_OUTPUT"
          echo "webadmin_version=$WEBADMIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"

          git fetch origin --tags
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG already exists; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "release_missing=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release $TAG is missing; publication will be retried."
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "release_missing=true" >> "$GITHUB_OUTPUT"
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "Stremio Server WebAdmin ${SERVER_VERSION}"
          git push origin "refs/tags/$TAG"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "release_missing=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Dispatch package publication
        id: dispatch
        if: steps.release.outputs.publish == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-package.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "release_tag=${{ steps.release.outputs.tag }}"

      - name: Create missing release directly when redispatch is unavailable
        if: >-
          steps.release.outputs.release_missing == 'true' &&
          steps.dispatch.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          SERVER_VERSION="${{ steps.release.outputs.server_version }}"
          WEBADMIN_VERSION="${{ steps.release.outputs.webadmin_version }}"
          CORE_VERSION="${{ steps.release.outputs.core_version }}"
          NOTES="docs/releases/${TAG}.md"
          NOTES_FILE="$NOTES"

          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="/tmp/release-notes.md"
            cat > "$NOTES_FILE" <<EOF
# Stremio Server WebAdmin ${SERVER_VERSION}

## Components

- Core: \`${CORE_VERSION}\`
- Server/Fork: \`${SERVER_VERSION}\`
- WebAdmin: \`${WEBADMIN_VERSION}\`
- VPN gateway: \`${SERVER_VERSION}\`

## Packages

- \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin:${SERVER_VERSION}\`
- \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin-webadmin:${WEBADMIN_VERSION}\`
- \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin-vpn:${SERVER_VERSION}\`
EOF
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Stremio Server WebAdmin ${SERVER_VERSION}" \
            --notes-file "$NOTES_FILE" \
            --latest
