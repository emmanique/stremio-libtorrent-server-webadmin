name: Fork integration guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate fork-owned files and versions
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            SERVER_VERSION FORK_VERSION VERSIONING.md VPN.md compose.yaml \
            start.sh start-vpn.sh vpn/Dockerfile vpn/entrypoint.sh Dockerfile \
            webadmin/Dockerfile webadmin/WEBADMIN_VERSION webadmin/app.py \
            webadmin/fork_update.py webadmin/package_update.py webadmin/version_lifecycle.py \
            webadmin/vpn_admin.py webadmin/vpn_profiles.py webadmin/transcoding_config.py \
            webadmin/transcoding_runtime_fix.py webadmin/transcoding_profiles.py \
            webadmin/transcoding_verified_status.py webadmin/static/vpn-admin.js; do
            test -f "$file" || { echo "Missing fork-owned file: $file" >&2; exit 1; }
          done
          cmp -s SERVER_VERSION FORK_VERSION || {
            echo 'SERVER_VERSION and FORK_VERSION must contain the same value.' >&2
            exit 1
          }
          grep -q 'COPY vpn_profiles.py' webadmin/Dockerfile
          grep -q 'vpn_profiles.install(app)' webadmin/transcoding_verified_status.py

      - name: Validate package-only runtime defaults
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  webadmin:' compose.yaml
          grep -q '^  pihole:' compose.yaml
          grep -q '172.30.0.53' compose.yaml
          grep -q 'ghcr.io/emmanique/stremio-libtorrent-server-webadmin:latest' compose.yaml
          grep -q 'ghcr.io/emmanique/stremio-libtorrent-server-webadmin-webadmin:latest' compose.yaml
          grep -q 'STREMIO_PACKAGE_REPO' compose.yaml
          grep -q 'vpn-data:/vpn' compose.yaml
          if grep -Eq '^[[:space:]]+build:' compose.yaml; then
            echo 'Default compose.yaml must consume published images, not local build contexts.' >&2
            exit 1
          fi
          grep -q 'SERVER_VERSION' Dockerfile
          grep -q 'FORK_VERSION' Dockerfile
          grep -q 'ffmpeg_wrapper.py' Dockerfile

      - name: Enforce component version bumps on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(Dockerfile|compose\.yaml|start-vpn\.sh|vpn/|docker/ffmpeg_wrapper\.py|docker/webadmin_entrypoint\.py)$'; then
            if git diff --quiet "$BASE_SHA"...HEAD -- SERVER_VERSION FORK_VERSION; then
              echo 'Server runtime/distribution integration changed without a SERVER_VERSION/FORK_VERSION bump.' >&2
              exit 1
            fi
          fi
          if printf '%s\n' "$changed" | grep -Eq '^webadmin/'; then
            if git diff --quiet "$BASE_SHA"...HEAD -- webadmin/WEBADMIN_VERSION; then
              echo 'WebAdmin changed without a WEBADMIN_VERSION bump.' >&2
              exit 1
            fi
          fi

      - name: Validate transactional updater guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'update-checkpoint.json' webadmin/fork_update.py
          grep -q 'rollback' webadmin/fork_update.py
          grep -q '_wait_healthy' webadmin/fork_update.py
          grep -q '_restore_old_container' webadmin/fork_update.py
          grep -q 'previousImageId' webadmin/fork_update.py
          grep -q 'PACKAGE_REPO' webadmin/package_update.py
          grep -q 'images.pull' webadmin/package_update.py
          grep -q '_activate_image' webadmin/package_update.py
          grep -q 'package version mismatch' webadmin/package_update.py

      - name: Validate independent component lifecycle
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'import package_update as transactional' webadmin/version_lifecycle.py
          grep -q 'SERVER_VERSION_URL' webadmin/version_lifecycle.py
          grep -q 'WEBADMIN_VERSION_URL' webadmin/version_lifecycle.py
          grep -q '/api/component-versions' webadmin/version_lifecycle.py
          grep -q 'guarded_server_update_worker' webadmin/version_lifecycle.py
          grep -q 'docker compose pull webadmin' webadmin/version_lifecycle.py

      - name: Validate CyberGhost VPN connection lifecycle
        shell: bash
        run: |
          set -euo pipefail
          sh -n start-vpn.sh
          sh -n vpn/entrypoint.sh
          export IPADDRESS=192.0.2.10
          export PIHOLE_WEB_BIND_IP=192.0.2.10
          test ! -e compose.vpn.yaml
          docker compose -f compose.yaml config --quiet
          grep -q '^  gluetun:' compose.yaml
          grep -q 'network_mode: "service:gluetun"' compose.yaml
          grep -q 'STREMIO_VPN_ENABLED_FILE: /vpn/enabled' compose.yaml
          grep -q 'HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE' compose.yaml
          grep -q 'OPENVPN_CUSTOM_CONFIG' vpn/entrypoint.sh
          grep -q 'startup_profile' vpn/entrypoint.sh
          grep -q 'next_profile' vpn/entrypoint.sh
          grep -q '/api/vpn/profiles' webadmin/vpn_profiles.py
          grep -q 'create_profile' webadmin/vpn_profiles.py
          grep -q 'activate_profile' webadmin/vpn_profiles.py
          grep -q 'delete_profile' webadmin/vpn_profiles.py
          grep -q 'Enable at startup' webadmin/static/vpn-admin.js
          grep -q '_set_vpn_requested(True)' webadmin/vpn_profiles.py
          ! grep -q 'gluetun.restart(' webadmin/vpn_profiles.py

      - name: Validate trusted connection and transcoding integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'httpsCert.json' webadmin/version_lifecycle.py
          grep -q 'stremio\\.rocks' webadmin/version_lifecycle.py
          grep -q -- '--development --webui-url=' webadmin/version_lifecycle.py
          grep -q '/api/transcoding/profiles' webadmin/transcoding_profiles.py
          grep -q 'runtime-profile-self-test' webadmin/transcoding_verified_status.py
          grep -q 'Full GPU' webadmin/transcoding_profiles.py

      - name: Validate Compose, Python, shell and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dns.yaml config --quiet
          docker compose -f compose.yaml -f compose.vaapi.yaml config --quiet
          python -m compileall -q webadmin docker/webadmin_entrypoint.py docker/ffmpeg_wrapper.py
          sh -n start.sh
          sh -n start-vpn.sh
          sh -n vpn/entrypoint.sh
          node --check webadmin/static/component-versions.js
          node --check webadmin/static/transcoding-dashboard.js
          node --check webadmin/static/transcoding-runtime-fix.js
          node --check webadmin/static/transcoding-simple-config.js
          node --check webadmin/static/vpn-admin.js

      - name: Reject upstream runtime defaults
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings \
            'https://github.com/andrewhack/stremio-libtorrent-server' \
            webadmin compose.yaml Dockerfile docker/webadmin_entrypoint.py docker/ffmpeg_wrapper.py; then
            echo 'Runtime/update paths must not use the upstream repository as their source.' >&2
            exit 1
          fi
