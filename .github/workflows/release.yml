name: Release

on:
  push:
    branches: [main]
    tags:
      - "v2.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish from main, e.g. 2.1.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: edmanique/stremio-libtorrent-server-webadmin
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Bootstrap release source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            git fetch --force origin main
            git checkout --detach origin/main
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            git fetch --force origin "$GITHUB_REF_NAME"
            git checkout --detach FETCH_HEAD
          else
            git fetch --force origin main
            git checkout --detach origin/main
            VERSION="$(tr -d '[:space:]' < FORK_VERSION)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "MAJOR=${VERSION%%.*}" >> "$GITHUB_ENV"
          echo "SERVER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin" >> "$GITHUB_ENV"
          echo "WEBADMIN_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin-webadmin" >> "$GITHUB_ENV"
          echo "VPN_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin-vpn" >> "$GITHUB_ENV"

      - name: Decide publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          SHOULD_PUBLISH=true
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              SHOULD_PUBLISH=false
              echo "[release] $TAG already exists; this main push is not a new release."
            else
              echo "[release] $TAG does not exist; publishing the coordinated release from main."
            fi
          fi
          echo "SHOULD_PUBLISH=$SHOULD_PUBLISH" >> "$GITHUB_ENV"

      - name: Install release tooling
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip uv
          uv lock --check
          uv sync --dev
          python3 -m pip install -r webadmin/requirements.txt

      - name: Validate release contract
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(tr -d '[:space:]' < SERVER_VERSION)"
          FORK="$(tr -d '[:space:]' < FORK_VERSION)"
          WEBADMIN="$(tr -d '[:space:]' < webadmin/WEBADMIN_VERSION)"
          CORE="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          test "$VERSION" = "$FORK"
          test "$FORK" = "$WEBADMIN"
          test "$SERVER" = "$CORE"
          test -f "docs/releases/v$VERSION.md"
          bash tools/ci/full-regression.sh

      - name: Ensure immutable release tag
        if: env.SHOULD_PUBLISH == 'true' && github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          TARGET="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING="$(git rev-list -n1 "$TAG")"
            if gh release view "$TAG" >/dev/null 2>&1; then
              test "$EXISTING" = "$TARGET" || {
                echo "Published tag $TAG is immutable and points to $EXISTING, not $TARGET." >&2
                exit 1
              }
            elif [ "$EXISTING" != "$TARGET" ]; then
              git push origin ":refs/tags/$TAG"
              git tag -d "$TAG"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" "$TARGET" -m "Stremio Server WebAdmin $VERSION"
              git push origin "$TAG"
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET" -m "Stremio Server WebAdmin $VERSION"
            git push origin "$TAG"
          fi

      - name: Login registries
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

      - name: Build and publish release images
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          COMMON=(--label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" --label "org.opencontainers.image.version=$VERSION")
          docker build "${COMMON[@]}" -t "$SERVER_IMAGE:$VERSION" -t "$SERVER_IMAGE:$MAJOR" -t "$SERVER_IMAGE:latest" .
          docker build "${COMMON[@]}" -t "$WEBADMIN_IMAGE:$VERSION" -t "$WEBADMIN_IMAGE:$MAJOR" -t "$WEBADMIN_IMAGE:latest" ./webadmin
          docker build "${COMMON[@]}" -t "$VPN_IMAGE:$VERSION" -t "$VPN_IMAGE:$MAJOR" -t "$VPN_IMAGE:latest" ./vpn
          for image in "$SERVER_IMAGE" "$WEBADMIN_IMAGE" "$VPN_IMAGE"; do
            docker push "$image:$VERSION"
            docker push "$image:$MAJOR"
            docker push "$image:latest"
          done

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            docker tag "$SERVER_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:$VERSION"
            docker tag "$SERVER_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:$MAJOR"
            docker tag "$SERVER_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:latest"
            docker tag "$WEBADMIN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:webadmin-$VERSION"
            docker tag "$WEBADMIN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:webadmin-$MAJOR"
            docker tag "$WEBADMIN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:webadmin-latest"
            docker tag "$VPN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:vpn-$VERSION"
            docker tag "$VPN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:vpn-$MAJOR"
            docker tag "$VPN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:vpn-latest"
            for tag in "$VERSION" "$MAJOR" latest "webadmin-$VERSION" "webadmin-$MAJOR" webadmin-latest "vpn-$VERSION" "vpn-$MAJOR" vpn-latest; do
              docker push "$DOCKERHUB_IMAGE:$tag"
            done
          fi

      - name: Build and publish deployment package
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python tools/release/build_deployment_package.py --version "$VERSION"
          (cd dist && sha256sum -c SHA256SUMS)
          NOTES="docs/releases/v$VERSION.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Stremio Server WebAdmin $VERSION" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" --verify-tag --title "Stremio Server WebAdmin $VERSION" --notes-file "$NOTES" --latest
          fi
          gh release upload "$TAG" dist/*-deployment.zip dist/*-deployment.tar.gz dist/SHA256SUMS --clobber
