name: Release

on:
  push:
    tags:
      - "v2.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish from main, e.g. 2.1.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: edmanique/stremio-libtorrent-server-webadmin

    steps:
      - name: Resolve release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            REF="main"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            REF="$GITHUB_REF_NAME"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release contract
        shell: bash
        env:
          VERSION: ${{ steps.source.outputs.version }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          SERVER="$(tr -d '[:space:]' < SERVER_VERSION)"
          FORK="$(tr -d '[:space:]' < FORK_VERSION)"
          WEBADMIN="$(tr -d '[:space:]' < webadmin/WEBADMIN_VERSION)"
          CORE="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"

          test "$VERSION" = "$FORK"
          test "$FORK" = "$WEBADMIN"
          test "$SERVER" = "$CORE"
          case "$VERSION" in 2.*) ;; *) echo "Only 2.x releases are supported here." >&2; exit 1;; esac
          test -f "docs/releases/$TAG.md"
          bash tools/ci/repo-guard.sh

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "MAJOR=${VERSION%%.*}" >> "$GITHUB_ENV"
          echo "SERVER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin" >> "$GITHUB_ENV"
          echo "WEBADMIN_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin-webadmin" >> "$GITHUB_ENV"
          echo "VPN_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin-vpn" >> "$GITHUB_ENV"

      - name: Ensure tag is safe
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          TARGET="$(git rev-parse HEAD)"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING="$(git rev-list -n1 "$TAG")"
            if gh release view "$TAG" >/dev/null 2>&1; then
              test "$EXISTING" = "$TARGET" || {
                echo "Published tag $TAG is immutable and points to $EXISTING, not $TARGET." >&2
                exit 1
              }
            elif [ "$EXISTING" != "$TARGET" ]; then
              git push origin ":refs/tags/$TAG"
              git tag -d "$TAG"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" "$TARGET" -m "Stremio Server WebAdmin $VERSION"
              git push origin "$TAG"
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET" -m "Stremio Server WebAdmin $VERSION"
            git push origin "$TAG"
          fi

      - name: Install and validate dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          uv lock --check
          uv sync --dev
          python -m pip install -r webadmin/requirements.txt
          uv pip check

      - name: Deterministic release tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. timeout 600s uv run --with-requirements webadmin/requirements.txt             pytest -q -m "not integration" tests

      - name: Network integration release tests
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if PYTHONPATH=. timeout 300s uv run --with-requirements webadmin/requirements.txt               pytest -q -m integration tests; then
              ok=1
              break
            fi
            [ "$attempt" -eq 3 ] || sleep $((attempt * 10))
          done
          test "$ok" -eq 1

      - name: Validate Compose variants
        shell: bash
        run: |
          set -euo pipefail
          export IPADDRESS=192.0.2.10
          export PIHOLE_WEB_BIND_IP=192.0.2.10
          export PIHOLE_DNS_BIND_IP=192.0.2.10
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dns.yaml config --quiet
          docker compose -f compose.yaml -f compose.vaapi.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build release images
        shell: bash
        run: |
          set -euo pipefail
          build_retry() {
            context="$1"; shift
            for attempt in 1 2 3; do
              docker build "$@" "$context" && return 0
              [ "$attempt" -eq 3 ] && return 1
              sleep $((attempt * 5))
            done
          }

          COMMON=(--label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" --label "org.opencontainers.image.version=$VERSION")
          build_retry . "${COMMON[@]}" -t "$SERVER_IMAGE:$VERSION" -t "$SERVER_IMAGE:$MAJOR" -t "$SERVER_IMAGE:latest"
          build_retry ./webadmin "${COMMON[@]}" -t "$WEBADMIN_IMAGE:$VERSION" -t "$WEBADMIN_IMAGE:$MAJOR" -t "$WEBADMIN_IMAGE:latest"
          build_retry ./vpn "${COMMON[@]}" -t "$VPN_IMAGE:$VERSION" -t "$VPN_IMAGE:$MAJOR" -t "$VPN_IMAGE:latest"

      - name: Smoke release images
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f stremio-release-smoke webadmin-release-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          docker run -d --name stremio-release-smoke -p 18099:11470 "$SERVER_IMAGE:$VERSION" >/dev/null
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:18099/health >/tmp/server-health.json 2>/dev/null && break
            sleep 1
          done
          test -s /tmp/server-health.json

          docker run -d --name webadmin-release-smoke -p 18090:8090 -v /var/run/docker.sock:/var/run/docker.sock "$WEBADMIN_IMAGE:$VERSION" >/dev/null
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:18090/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18090/ | grep -q 'vpn-admin.js'
          docker run --rm --entrypoint /bin/sh "$VPN_IMAGE:$VERSION"             -c 'test -x /stremio-vpn-entrypoint && test -x /gluetun-entrypoint'

      - name: Publish GHCR
        shell: bash
        run: |
          set -euo pipefail
          for image in "$SERVER_IMAGE" "$WEBADMIN_IMAGE" "$VPN_IMAGE"; do
            docker push "$image:$VERSION"
            docker push "$image:$MAJOR"
            docker push "$image:latest"
          done

      - name: Mirror to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$SERVER_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:$VERSION"
          docker tag "$SERVER_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:$MAJOR"
          docker tag "$SERVER_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:latest"
          docker tag "$WEBADMIN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:webadmin-$VERSION"
          docker tag "$WEBADMIN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:webadmin-$MAJOR"
          docker tag "$WEBADMIN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:webadmin-latest"
          docker tag "$VPN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:vpn-$VERSION"
          docker tag "$VPN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:vpn-$MAJOR"
          docker tag "$VPN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:vpn-latest"

          for tag in "$VERSION" "$MAJOR" latest "webadmin-$VERSION" "webadmin-$MAJOR" webadmin-latest "vpn-$VERSION" "vpn-$MAJOR" vpn-latest; do
            docker push "$DOCKERHUB_IMAGE:$tag"
          done

          DOCKERHUB_USER="$DOCKERHUB_USERNAME" REPO=edmanique/stremio-libtorrent-server-webadmin             sh docker/push-readme.sh || true

      - name: Verify anonymous pulls
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker logout docker.io >/dev/null 2>&1 || true
          rm -f "$HOME/.docker/config.json" || true

          docker pull "$SERVER_IMAGE:$VERSION"
          docker pull "$WEBADMIN_IMAGE:$VERSION"
          docker pull "$VPN_IMAGE:$VERSION"

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            docker pull "$DOCKERHUB_IMAGE:$VERSION"
            docker pull "$DOCKERHUB_IMAGE:webadmin-$VERSION"
            docker pull "$DOCKERHUB_IMAGE:vpn-$VERSION"
          fi

      - name: Create or refresh GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="docs/releases/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Stremio Server WebAdmin $VERSION" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" --verify-tag --title "Stremio Server WebAdmin $VERSION" --notes-file "$NOTES" --latest
          fi
