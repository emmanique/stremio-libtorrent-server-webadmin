name: Upstream sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upstream-sync.yml"
      - ".github/upstream-protected-paths.txt"
      - "tools/upstream/**"
      - "tools/ci/**"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Bootstrap main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --force origin main upstream/integration || git fetch --force origin main
          git checkout -B main origin/main

      - name: Prepare controlled upstream integration
        id: sync
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/andrewhack/stremio-libtorrent-server.git
          UPSTREAM_NAME: andrewhack/stremio-libtorrent-server
          TARGET_BRANCH: upstream/integration
        run: bash tools/upstream/controlled_sync.sh

      - name: Validate integration
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip uv
          uv lock --check
          uv sync --dev
          python3 -m pip install -r webadmin/requirements.txt
          bash tools/ci/full-regression.sh

      - name: Open or refresh PR to development
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ steps.sync.outputs.version }}
          TARGET_SHA: ${{ steps.sync.outputs.target }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --state open --base development --head upstream/integration --json number --jq '.[0].number // empty')"
          title="Integrate upstream $TARGET_VERSION"
          body="Controlled upstream integration for $TARGET_VERSION ($TARGET_SHA). Fork-owned paths were preserved and Full regression passed on upstream/integration. Production remains isolated until the normal release flow."
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            gh pr create --base development --head upstream/integration --title "$title" --body "$body"
          fi
