name: Publish validated 2.x tag

on:
  workflow_run:
    workflows:
      - "2.x Continuous Validation"
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-validated-2x-tag
  cancel-in-progress: false

jobs:
  tag:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate release version contract
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < SERVER_VERSION)"
          FORK="$(tr -d '[:space:]' < FORK_VERSION)"
          WEBADMIN="$(tr -d '[:space:]' < webadmin/WEBADMIN_VERSION)"
          CORE="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"

          test "$VERSION" = "$FORK"
          test "$VERSION" = "$WEBADMIN"
          test "$VERSION" = "$CORE"

          case "$VERSION" in
            2.*) ;;
            *) echo "Not a 2.x release version: $VERSION" >&2; exit 1 ;;
          esac

          test -f "docs/releases/v$VERSION.md"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify commit is current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          VALIDATED="${{ github.event.workflow_run.head_sha }}"
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$VALIDATED" = "$CURRENT_MAIN" || {
            echo "Validated commit $VALIDATED is no longer current main ($CURRENT_MAIN)." >&2
            exit 1
          }

      - name: Ensure release tag points to validated main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          VALIDATED="${{ github.event.workflow_run.head_sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING="$(git rev-list -n1 "$TAG")"

            if gh release view "$TAG" >/dev/null 2>&1; then
              test "$EXISTING" = "$VALIDATED" || {
                echo "Published release $TAG points to $EXISTING, not validated main $VALIDATED; refusing to move an immutable release tag." >&2
                exit 1
              }
              echo "Published tag $TAG already points to validated main."
              exit 0
            fi

            if [ "$EXISTING" != "$VALIDATED" ]; then
              echo "Unpublished tag $TAG points to $EXISTING; moving it to validated main $VALIDATED."
              git push origin ":refs/tags/$TAG"
              git tag -d "$TAG"
              git tag -a "$TAG" "$VALIDATED" -m "Stremio Server WebAdmin $VERSION"
              git push origin "$TAG"
            else
              echo "Unpublished tag $TAG already points to validated main."
            fi
          else
            git tag -a "$TAG" "$VALIDATED" -m "Stremio Server WebAdmin $VERSION"
            git push origin "$TAG"
            echo "Published $TAG from validated main commit."
          fi

      - name: Dispatch 2.x release publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; publication is complete."
            exit 0
          fi

          echo "Dispatching 2.x Release for $TAG"
          gh workflow run 2x-release.yml --ref main -f release_tag="$TAG"
