name: Windows launcher guard

on:
  push:
    branches:
      - future
      - main
    paths:
      - "start.bat"
      - "start-vpn.bat"
      - "start.ps1"
      - "start-vpn.ps1"
      - ".gitattributes"
      - "docs/WINDOWS.md"
      - ".github/workflows/windows-launcher-guard.yml"
  pull_request:
    paths:
      - "start.bat"
      - "start-vpn.bat"
      - "start.ps1"
      - "start-vpn.ps1"
      - ".gitattributes"
      - "docs/WINDOWS.md"
      - ".github/workflows/windows-launcher-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell launchers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          foreach ($file in @('start.ps1', 'start-vpn.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse errors in ${file}:" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            } else {
              Write-Host "${file}: syntax OK"
            }
          }
          if ($failed) { exit 1 }

      - name: Validate batch wrappers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('start.bat', 'start-vpn.bat')) {
            $text = Get-Content -Raw $file
            if ($text -notmatch 'powershell\.exe') { throw "$file does not invoke PowerShell" }
            if ($text -notmatch '%\*') { throw "$file does not forward command-line arguments" }
            if ($text -notmatch 'exit /b %ERRORLEVEL%') { throw "$file does not preserve launcher exit code" }
            Write-Host "${file}: wrapper contract OK"
          }

      - name: Validate Windows documentation references
        shell: powershell
        run: |
          $text = Get-Content -Raw docs/WINDOWS.md
          foreach ($name in @('start.bat', 'start-vpn.bat', 'start.ps1', 'start-vpn.ps1')) {
            if ($text -notmatch [regex]::Escape($name)) { throw "docs/WINDOWS.md does not reference $name" }
          }
          Write-Host 'Windows launcher documentation references: OK'
