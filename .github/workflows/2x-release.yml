name: 2.x Release

on:
  push:
    tags:
      - "v2.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v2.0.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: 2x-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: edmanique/stremio-libtorrent-server-webadmin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate 2.x release contract
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < SERVER_VERSION)"
          FORK="$(tr -d '[:space:]' < FORK_VERSION)"
          WEBADMIN="$(tr -d '[:space:]' < webadmin/WEBADMIN_VERSION)"
          CORE="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          test "$VERSION" = "$FORK"
          test "$VERSION" = "$WEBADMIN"
          test "$VERSION" = "$CORE"
          test "$RELEASE_TAG" = "v$VERSION"
          case "$VERSION" in 2.*) ;; *) exit 1;; esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SERVER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin" >> "$GITHUB_ENV"
          echo "WEBADMIN_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin-webadmin" >> "$GITHUB_ENV"
          echo "VPN_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stremio-libtorrent-server-webadmin-vpn" >> "$GITHUB_ENV"

      - name: Run release test gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          uv sync --dev
          python -m pip install -r webadmin/requirements.txt

          PYTHONPATH=. timeout 600s uv run --with-requirements webadmin/requirements.txt             pytest -q -m "not integration" tests

          integration_ok=0
          for attempt in 1 2 3; do
            echo "Network integration attempt $attempt/3"
            if PYTHONPATH=. timeout 300s uv run --with-requirements webadmin/requirements.txt               pytest -q -m integration tests; then
              integration_ok=1
              break
            fi
            [ "$attempt" -eq 3 ] || sleep $((attempt * 10))
          done
          test "$integration_ok" -eq 1

          export IPADDRESS=192.0.2.10 PIHOLE_WEB_BIND_IP=192.0.2.10
          docker compose config --quiet

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build release images
        shell: bash
        run: |
          set -euo pipefail
          build_retry() {
            context="$1"
            shift
            for attempt in 1 2 3; do
              if docker build "$@" "$context"; then
                return 0
              fi
              echo "Docker release build failed for $context (attempt $attempt/3)." >&2
              [ "$attempt" -eq 3 ] && return 1
              sleep $((attempt * 5))
            done
          }
          build_retry . -t "$SERVER_IMAGE:$VERSION" -t "$SERVER_IMAGE:2" -t "$SERVER_IMAGE:latest"
          build_retry ./webadmin -t "$WEBADMIN_IMAGE:$VERSION" -t "$WEBADMIN_IMAGE:2" -t "$WEBADMIN_IMAGE:latest"
          build_retry ./vpn -t "$VPN_IMAGE:$VERSION" -t "$VPN_IMAGE:2" -t "$VPN_IMAGE:latest"

      - name: Smoke test release images
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "$VPN_IMAGE:$VERSION" -c 'test -x /stremio-vpn-entrypoint && test -x /gluetun-entrypoint'
          docker run --rm --entrypoint python "$WEBADMIN_IMAGE:$VERSION" -c 'import app'
          docker image inspect "$SERVER_IMAGE:$VERSION" >/dev/null

      - name: Publish GHCR
        run: |
          for image in "$SERVER_IMAGE" "$WEBADMIN_IMAGE" "$VPN_IMAGE"; do
            docker push "$image:$VERSION"
            docker push "$image:2"
            docker push "$image:latest"
          done

      - name: Mirror validated images to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag "$SERVER_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:$VERSION"
          docker tag "$SERVER_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:2"
          docker tag "$SERVER_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:latest"
          docker tag "$WEBADMIN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:webadmin-$VERSION"
          docker tag "$WEBADMIN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:webadmin-2"
          docker tag "$WEBADMIN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:webadmin-latest"
          docker tag "$VPN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:vpn-$VERSION"
          docker tag "$VPN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:vpn-2"
          docker tag "$VPN_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:vpn-latest"
          docker push "$DOCKERHUB_IMAGE:$VERSION"
          docker push "$DOCKERHUB_IMAGE:2"
          docker push "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:webadmin-$VERSION"
          docker push "$DOCKERHUB_IMAGE:webadmin-2"
          docker push "$DOCKERHUB_IMAGE:webadmin-latest"
          docker push "$DOCKERHUB_IMAGE:vpn-$VERSION"
          docker push "$DOCKERHUB_IMAGE:vpn-2"
          docker push "$DOCKERHUB_IMAGE:vpn-latest"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="docs/releases/v$VERSION.md"
          test -f "$NOTES"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Stremio Server WebAdmin $VERSION" --notes-file "$NOTES" --latest
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Stremio Server WebAdmin $VERSION" --notes-file "$NOTES" --latest
          fi
