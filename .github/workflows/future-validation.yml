name: Future full validation

on:
  push:
    branches:
      - future
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: future-full-validation
  cancel-in-progress: true

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and project dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --dev
          python -m pip install -r webadmin/requirements.txt

      - name: Run deterministic functional test gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s uv run pytest -q \
            tests/test_app.py \
            tests/test_config.py \
            tests/test_health.py \
            tests/test_cache.py \
            tests/test_metrics.py \
            tests/test_addon_learning.py \
            tests/test_addon_model.py \
            tests/test_addon_routes.py \
            tests/test_library_addon_api.py \
            tests/test_library_download_api.py \
            tests/test_library_labels.py \
            tests/test_library_metadata.py \
            tests/test_library_mount.py \
            tests/test_library_page.py \
            tests/test_library_poster_fallback.py \
            tests/test_library_session.py \
            tests/test_library_state.py \
            tests/test_netguard.py \
            tests/test_pins.py \
            tests/test_pins_api.py \
            tests/test_ffmpeg_cmd.py \
            tests/test_converter_cmd.py \
            tests/test_probe.py \
            tests/test_profiler.py \
            tests/test_hls_routes.py \
            tests/test_ffmpeg_wrapper_policy.py

      - name: Validate WebAdmin configuration lifecycle
        run: |
          timeout 120s uv run --with-requirements webadmin/requirements.txt pytest -q \
            tests/test_webadmin_config_lifecycle.py \
            tests/test_webadmin_transcoding_detection.py

      - name: Validate Python and shell syntax
        run: |
          python -m compileall -q webadmin docker/webadmin_entrypoint.py docker/ffmpeg_wrapper.py
          sh -n start.sh
          sh -n start-vpn.sh
          sh -n vpn/entrypoint.sh
          sh -n docker/launch.sh
          sh -n docker/publish.sh
          sh -n docker/push-readme.sh
          node --check webadmin/static/vpn-admin.js

      - name: Validate all Compose variants
        shell: bash
        run: |
          set -euo pipefail
          export IPADDRESS=192.0.2.10
          export PIHOLE_WEB_BIND_IP=192.0.2.10
          export PIHOLE_DNS_BIND_IP=192.0.2.10
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dns.yaml config --quiet
          docker compose -f compose.yaml -f compose.vaapi.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
          STREMIO_IMAGE=ghcr.io/emmanique/stremio-libtorrent-server-webadmin:latest docker compose -f compose.hub.yaml config --quiet
          test ! -e compose.vpn.yaml

      - name: Validate package-only full stack
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ghcr.io/emmanique/stremio-libtorrent-server-webadmin:latest' compose.yaml
          grep -q 'ghcr.io/emmanique/stremio-libtorrent-server-webadmin-webadmin:latest' compose.yaml
          grep -q 'STREMIO_PACKAGE_REPO' compose.yaml
          grep -q 'pull_policy: always' compose.yaml
          if grep -Eq '^[[:space:]]+build:' compose.yaml; then
            echo 'compose.yaml unexpectedly requires a local build context'
            exit 1
          fi
          grep -q 'docker compose pull' start.sh
          grep -q 'images.pull' webadmin/package_update.py
          grep -q 'import package_update as transactional' webadmin/version_lifecycle.py
          grep -q 'docker compose pull webadmin' webadmin/version_lifecycle.py

      - name: Validate CyberGhost VPN profile integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  gluetun:' compose.yaml
          grep -q 'network_mode: "service:gluetun"' compose.yaml
          grep -q 'STREMIO_VPN_ENABLED_FILE: /vpn/enabled' compose.yaml
          grep -q 'HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE' compose.yaml
          grep -q 'vpn-data:/vpn' compose.yaml
          grep -q 'OPENVPN_CUSTOM_CONFIG' vpn/entrypoint.sh
          grep -q 'startup_profile' vpn/entrypoint.sh
          grep -q 'next_profile' vpn/entrypoint.sh
          grep -q 'openvpn.runtime.ovpn' vpn/entrypoint.sh
          grep -q '/api/vpn/status' webadmin/vpn_admin.py
          grep -q '/api/vpn/profiles' webadmin/vpn_profiles.py
          grep -q 'openvpn.ovpn' webadmin/vpn_profiles.py
          grep -q 'ca.crt' webadmin/vpn_profiles.py
          grep -q 'client.crt' webadmin/vpn_profiles.py
          grep -q 'client.key' webadmin/vpn_profiles.py
          grep -q 'vpn_profiles.install(app)' webadmin/transcoding_verified_status.py
          grep -q 'New connection' webadmin/static/vpn-admin.js
          grep -q 'Use this connection automatically when the VPN gateway starts' webadmin/static/vpn-admin.js
          grep -q 'Pre-shared' webadmin/static/vpn-admin.js
          grep -q 'Server group' webadmin/static/vpn-admin.js
          grep -q '_set_vpn_requested(True)' webadmin/vpn_profiles.py

      - name: Validate WebAdmin package build
        run: docker build -t webadmin-validation:local ./webadmin

      - name: Validate VPN gateway package build
        run: |
          docker build -t vpn-validation:local ./vpn
          docker run --rm --entrypoint /bin/sh vpn-validation:local -c 'test -x /stremio-vpn-entrypoint && test -x /gluetun-entrypoint'

      - name: Enforce fork-owned runtime paths
        shell: bash
        run: |
          set -euo pipefail
          forbidden='androshack/stremio-libtorrent-server'
          if grep -R --line-number --fixed-strings "$forbidden" \
              compose.hub.yaml docker/launch.sh \
              docker/publish.sh docker/push-readme.sh; then
            echo 'Runtime/distribution paths must not default to the upstream image/repository.'
            exit 1
          fi

          for path in \
            start.sh \
            start-vpn.sh \
            vpn \
            compose.gpu.yaml \
            compose.hub.yaml \
            docker/launch.sh \
            docker/publish.sh \
            docker/push-readme.sh; do
            grep -Fxq "$path" .github/upstream-protected-paths.txt || {
              echo "$path is fork-owned but is not protected from upstream sync"
              exit 1
            }
          done

      - name: Validate release identifiers
        run: |
          cmp -s SERVER_VERSION FORK_VERSION
          test -s webadmin/WEBADMIN_VERSION
