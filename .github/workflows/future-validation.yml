name: Future full validation

on:
  push:
    branches:
      - future
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: future-full-validation
  cancel-in-progress: true

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and project dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --dev

      - name: Run deterministic functional test gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s uv run pytest -q \
            tests/test_app.py \
            tests/test_config.py \
            tests/test_health.py \
            tests/test_cache.py \
            tests/test_metrics.py \
            tests/test_addon_learning.py \
            tests/test_addon_model.py \
            tests/test_addon_routes.py \
            tests/test_library_addon_api.py \
            tests/test_library_download_api.py \
            tests/test_library_labels.py \
            tests/test_library_metadata.py \
            tests/test_library_mount.py \
            tests/test_library_page.py \
            tests/test_library_poster_fallback.py \
            tests/test_library_session.py \
            tests/test_library_state.py \
            tests/test_netguard.py \
            tests/test_pins.py \
            tests/test_pins_api.py \
            tests/test_ffmpeg_cmd.py \
            tests/test_converter_cmd.py \
            tests/test_probe.py \
            tests/test_profiler.py \
            tests/test_hls_routes.py

      - name: Validate shell syntax
        run: |
          sh -n start.sh
          sh -n docker/launch.sh
          sh -n docker/publish.sh
          sh -n docker/push-readme.sh

      - name: Validate all Compose variants
        shell: bash
        run: |
          set -euo pipefail
          export IPADDRESS=192.0.2.10
          export PIHOLE_WEB_BIND_IP=192.0.2.10
          export PIHOLE_DNS_BIND_IP=192.0.2.10
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dns.yaml config --quiet
          docker compose -f compose.yaml -f compose.vaapi.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
          STREMIO_IMAGE=stremio-libtorrent-server-webadmin:local docker compose -f compose.hub.yaml config --quiet
          WIREGUARD_PRIVATE_KEY=dummy WIREGUARD_ADDRESSES=10.2.0.2/32 STREMIO_IMAGE=stremio-libtorrent-server-webadmin:local docker compose -f compose.vpn.yaml config --quiet

      - name: Enforce fork-owned runtime paths
        shell: bash
        run: |
          set -euo pipefail
          forbidden='androshack/stremio-libtorrent-server'
          if grep -R --line-number --fixed-strings "$forbidden" \
              compose.hub.yaml compose.vpn.yaml docker/launch.sh; then
            echo "Runtime launch paths must not default to the upstream image."
            exit 1
          fi

          for path in \
            start.sh \
            compose.gpu.yaml \
            compose.hub.yaml \
            compose.vpn.yaml \
            docker/launch.sh \
            docker/publish.sh \
            docker/push-readme.sh; do
            grep -Fxq "$path" .github/upstream-protected-paths.txt || {
              echo "$path is fork-owned but is not protected from upstream sync"
              exit 1
            }
          done

      - name: Validate release identifiers
        run: |
          cmp -s SERVER_VERSION FORK_VERSION
          test -s webadmin/WEBADMIN_VERSION
