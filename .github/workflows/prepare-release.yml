name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New semantic version such as 2.1.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Prepare platform version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python tools/release/prepare_version.py

      - name: Validate prepared release
        run: |
          bash tools/ci/repo-guard.sh
          uv lock --check
          python -m compileall -q src webadmin docker tools

      - name: Create release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/$VERSION"

          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          git add \
            FORK_VERSION \
            webadmin/WEBADMIN_VERSION \
            uv.lock \
            "docs/releases/v$VERSION.md"

          git commit -m "Prepare release $VERSION"
          git push origin "$BRANCH"

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/$VERSION"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release $VERSION" \
            --body "Prepare platform release $VERSION from `development`. Update README.md/QUICKSTART.md and complete the release notes in this PR before merge. Merge only after Fast CI, Full regression and Dependencies are green. After publication, sync `main` back into `development` and delete this temporary release branch."
