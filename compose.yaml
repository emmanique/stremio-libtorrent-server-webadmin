name: stremio-platform
services:
  stremio-libtorrent-server:
    build:
      context: .
    pull_policy: build
    image: stremio-libtorrent-server-webadmin:local
    container_name: stremio-libtorrent-server
    restart: unless-stopped
    environment:
      STREMIOSRV_BT_LISTEN_PORT: "${STREMIOSRV_BT_LISTEN_PORT:-6881}"
      STREMIOSRV_CACHE_ROOT: /root/.stremio-server
      STREMIOSRV_EXTERNAL_CONFIG: /config/admin-settings.json
      CERT_FILE: "${CERT_FILE:-certificates.pem}"
      IPADDRESS: "${IPADDRESS:-}"
      SERVER_URL: "${SERVER_URL:-}"
    dns: [172.30.0.53]
    ports:
      - "${IPADDRESS:-0.0.0.0}:8080:8080"
      - "${IPADDRESS:-0.0.0.0}:11470:11470"
      - "${IPADDRESS:-0.0.0.0}:12470:12470"
      - "${IPADDRESS:-0.0.0.0}:${STREMIOSRV_BT_LISTEN_PORT:-6881}:${STREMIOSRV_BT_LISTEN_PORT:-6881}/tcp"
      - "${IPADDRESS:-0.0.0.0}:${STREMIOSRV_BT_LISTEN_PORT:-6881}:${STREMIOSRV_BT_LISTEN_PORT:-6881}/udp"
    volumes:
      - ${STREMIO_DATA_DIR:-stremio-cache}:/root/.stremio-server
      - stremio-config:/config:ro
    networks:
      stremio-internal:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11470/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  webadmin:
    build:
      context: ./webadmin
    pull_policy: build
    image: stremio-webadmin:separated-v2
    container_name: stremio-webadmin
    restart: unless-stopped
    environment:
      WEBADMIN_STATE: /data
      STREMIO_CONFIG_FILE: /config/admin-settings.json
      STREMIO_URL: http://stremio-libtorrent-server:11470
      STREMIO_CONTAINER: stremio-libtorrent-server
      STREMIO_IMAGE: stremio-libtorrent-server-webadmin:local
      STREMIO_SOURCE_REPO: https://github.com/emmanique/stremio-libtorrent-server-webadmin
      STREMIO_SOURCE_BRANCH: main
      IPADDRESS: "${IPADDRESS:-localhost}"
      WEB_PLAYER_URL: "http://${IPADDRESS:-localhost}:8080"
      SERVER_URL: "http://${IPADDRESS:-localhost}:11470"
    ports:
      - "${IPADDRESS:-0.0.0.0}:8090:8090"
    volumes:
      - webadmin-data:/data
      - stremio-config:/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [stremio-internal]
    depends_on:
      stremio-libtorrent-server:
        condition: service_healthy

  pihole:
    image: pihole/pihole:latest
    container_name: stremio-pihole
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Africa/Luanda}"
      FTLCONF_webserver_api_password: ""
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_upstreams: "${PIHOLE_UPSTREAM_DNS:-1.1.1.1;1.0.0.1}"
    ports:
      - "${IPADDRESS:?Defina IPADDRESS no .env}:53:53/tcp"
      - "${IPADDRESS:?Defina IPADDRESS no .env}:53:53/udp"
      - "${IPADDRESS:?Defina IPADDRESS no .env}:${PIHOLE_WEB_PORT:-8053}:80/tcp"
    volumes:
      - pihole-etc:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d
    networks:
      stremio-internal:
        ipv4_address: 172.30.0.53

networks:
  stremio-internal:
    name: stremio-internal
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  stremio-cache:
  stremio-config:
  webadmin-data:
  pihole-etc:
  pihole-dnsmasq:
